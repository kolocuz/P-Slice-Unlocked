apply plugin: 'com.android.application'

android {
    compileSdkVersion Integer.parseInt(project.ANDROID_BUILD_SDK_VERSION)
    buildToolsVersion project.ANDROID_BUILD_TOOLS_VERSION
    ::if (ANDROID_GRADLE_PLUGIN>="4.0")::ndkPath '::ANDROID_NDK_ROOT_ESCAPED::'::end::
    ::if (ANDROID_NDK_VERSION)::ndkVersion '::ANDROID_NDK_VERSION::'::end::

    defaultConfig {
        applicationId project.APP_PACKAGE
        minSdkVersion Integer.parseInt(project.ANDROID_MIN_SDK_VERSION)
        targetSdkVersion Integer.parseInt(project.ANDROID_TARGET_SDK_VERSION)
        versionCode Integer.parseInt(project.APP_VERSION_CODE)
        versionName project.APP_VERSION_NAME

        ::if (ANDROID_GRADLE_PLUGIN>="4.0")::
        multiDexEnabled true
        ::end::
    }

    signingConfigs {
        release {
            storeFile file('../../../../' + project.KEYSTORE_PATH)
            storePassword project.KEYSTORE_PASSWORD
            keyAlias project.KEY_ALIAS
            keyPassword project.KEY_ALIAS_PASSWORD
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // firebaseCrashlytics()
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        disable 'GradleCompatible'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    // implementation 'com.google.firebase:firebase-crashlytics:18.6.0'
    // implementation 'com.google.firebase:firebase-analytics:21.5.0'
}