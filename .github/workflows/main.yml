name: Build P-Slice Unlocked

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'windows'
          - 'linux'
          - 'android'
          - 'desktop'

      version:
        description: 'Build version'
        required: true
        type: string
        default: '1.0.0'

      build_mode:
        description: 'Build type'
        required: true
        type: choice
        default: 'artifact'
        options:
          - 'artifact'
          - 'release'

jobs:
  BuildDesktopCache:
    name: Cache Desktop
    if: ${{ inputs.platform == 'all' || inputs.platform == 'desktop' || inputs.platform == 'windows' || inputs.platform == 'linux' }}
    permissions: write-all
    uses: ./.github/workflows/dependencies.yml
    with:
      os: ubuntu-24.04
      setupScript: sh ./setup/unix.sh
      CACHE_NAME: P-Slice-Unlocked-desktop-cache

  BuildMobileCache:
    name: Cache Mobile
    if: ${{ inputs.platform == 'all' || inputs.platform == 'android' }}
    permissions: write-all
    uses: ./.github/workflows/dependencies.yml
    with:
      os: ubuntu-24.04
      setupScript: sh ./setup/mobile.sh
      CACHE_NAME: P-Slice-Unlocked-mobile-cache

  BuildWindows:
    name: Windows
    if: ${{ inputs.platform == 'all' || inputs.platform == 'desktop' || inputs.platform == 'windows' }}
    needs: BuildDesktopCache
    permissions: write-all
    uses: ./.github/workflows/build.yml
    with:
      name: Windows
      os: windows-2022
      buildArgs: ${{ format('windows{0}', inputs.build_mode == 'release' && ' -final' || '') }}
      exportPath: windows
      artifactName: ${{ format('PSlice-Unlocked-v{0}-Windows', inputs.version) }}
      cacheLibrariesPath: P-Slice-Unlocked-desktop-cache
      cachePath: ${{ format('PSlice-Unlocked-build-windows-v{0}', inputs.version) }}
      artifactPath: export\release\windows\bin\*

  BuildLinux:
    name: Linux
    if: ${{ inputs.platform == 'all' || inputs.platform == 'desktop' || inputs.platform == 'linux' }}
    needs: BuildDesktopCache
    permissions: write-all
    uses: ./.github/workflows/build.yml
    with:
      name: Linux
      os: ubuntu-22.04
      buildArgs: ${{ format('linux{0}', inputs.build_mode == 'release' && ' -final' || '') }}
      exportPath: linux
      artifactName: ${{ format('PSlice-Unlocked-v{0}-Linux', inputs.version) }}
      cacheLibrariesPath: P-Slice-Unlocked-desktop-cache
      cachePath: ${{ format('PSlice-Unlocked-build-linux-v{0}', inputs.version) }}
      artifactPath: export/release/linux/bin/*

  BuildAndroid:
    name: Android
    if: ${{ inputs.platform == 'all' || inputs.platform == 'android' }}
    needs: BuildMobileCache
    permissions: write-all
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore Haxe libraries cache
        uses: actions/cache/restore@v3
        with:
          path: |
            ~/.haxelib
            ~/.hxcpp
          key: ${{ runner.os }}-haxe-${{ hashFiles('setup/mobile.sh') }}
          restore-keys: |
            ${{ runner.os }}-haxe-

      - name: Install Haxe dependencies
        run: |
          chmod +x setup/mobile.sh
          sh ./setup/mobile.sh

      - name: Save Haxe libraries cache
        uses: actions/cache/save@v3
        with:
          path: |
            ~/.haxelib
            ~/.hxcpp
          key: ${{ runner.os }}-haxe-${{ hashFiles('setup/mobile.sh') }}

      - name: Build Android
        run: |
          lime build android ${{ inputs.build_mode == 'release' && '-final' || '' }}

      - name: 🔥 NUKE FIREBASE from generated build.gradle
        run: |
          echo "🔥 Looking for build.gradle files..."
          find . -name "build.gradle" -type f -print0 | while IFS= read -r -d '' file; do
            echo "Processing $file"
            sed -i '/firebaseCrashlytics()/d' "$file"
            sed -i '/google-services/d' "$file"
            sed -i '/com.google.firebase/d' "$file"
          done
          echo "🔥 Firebase removed from all build.gradle files!"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ format('PSlice-Unlocked-v{0}-Android', inputs.version) }}
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          retention-days: 7

  CreateRelease:
    name: Create GitHub Release
    if: ${{ inputs.build_mode == 'release' && always() }}
    needs: [BuildWindows, BuildLinux, BuildAndroid]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        if: ${{ inputs.platform == 'all' || inputs.platform == 'desktop' || inputs.platform == 'windows' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ format('PSlice-Unlocked-v{0}-Windows', inputs.version) }}
          path: ./artifacts/windows

      - name: Download Linux artifact
        if: ${{ inputs.platform == 'all' || inputs.platform == 'desktop' || inputs.platform == 'linux' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ format('PSlice-Unlocked-v{0}-Linux', inputs.version) }}
          path: ./artifacts/linux

      - name: Download Android artifact
        if: ${{ inputs.platform == 'all' || inputs.platform == 'android' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ format('PSlice-Unlocked-v{0}-Android', inputs.version) }}
          path: ./artifacts/android

      - name: Create ZIP archives
        run: |
          cd artifacts
          for dir in */; do
            if [ -d "$dir" ]; then
              zip -r "../PSlice-Unlocked-v${{ inputs.version }}-${dir%/}.zip" "$dir"
            fi
          done
          cd ..
          ls -la *.zip

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version }}
          name: P-Slice Unlocked v${{ inputs.version }}
          body: ${{ inputs.version }}
          draft: false
          prerelease: false
          files: |
            *.zip
            artifacts/android/*.apk